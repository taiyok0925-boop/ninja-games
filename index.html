<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NINJA GAMES</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<style>
  *, *::before, *::after{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
  }

  .hero{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
  }

  /* ===================== INTRO ===================== */
  .intro{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    transition:opacity 1.1s ease, visibility 1.1s ease;
  }
  .intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .intro-grain{
    position:absolute;
    inset:0;
    filter:url(#grain);
    mix-blend-mode:overlay;
    opacity:0.16;
    pointer-events:none;
  }
  .intro-logo{
    position:relative;
    z-index:1;
    width:clamp(220px, 42vw, 380px);
    height:auto;
    display:block;
    opacity:0;
    transform:scale(0.94);
    filter:blur(6px);
    transition:opacity 3.2s cubic-bezier(.16,.84,.44,1),
               transform 3.2s cubic-bezier(.16,.84,.44,1),
               filter 3.2s cubic-bezier(.16,.84,.44,1);
  }
  .intro-logo.show{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
  .intro-logo path{ fill:#fff; }

  /* ① 背景動画 */
  .hero-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
  }

  /* ② ビネット */
  .hero-vignette{
    position:absolute;
    inset:0;
    z-index:2;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    pointer-events:none;
  }

  /* ③ フィルムグレイン */
  .hero-grain{
    position:absolute;
    inset:0;
    z-index:3;
    filter:url(#grain);
    mix-blend-mode:overlay;
    opacity:0.22;
    pointer-events:none;
  }

  /* ④ 黒半透明オーバーレイ */
  .hero-overlay{
    position:absolute;
    inset:0;
    z-index:4;
    background:rgba(0,0,0,0.28);
    pointer-events:none;
  }

  /* ⑤ ロゴ(NINJA GAMES ロゴタイプ、アウトラインのみ) */
  .hero-title{
    position:absolute;
    inset:0;
    z-index:5;
    width:100%;
    height:100%;
    overflow:hidden;
    user-select:none;
    pointer-events:none;
  }
  .hero-title svg{
    display:block;
    width:100%;
    height:100%;
  }
  .hero-title path{
    fill:none;
    stroke:#fff;
    stroke-opacity:0.7;
    stroke-width:0.6;
    stroke-linejoin:round;
    stroke-linecap:round;
  }
</style>
</head>
